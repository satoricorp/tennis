version: 2
project_name: tennis

builds:
  - main: ./cmd/tennis
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  draft: false
