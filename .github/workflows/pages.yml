name: pages
on:
  push:
    branches: [main]
    # The Go code and the marketing site share a repo but not a release
    # cadence; only site changes should redeploy the site.
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so the last push
# to land is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      # path is workspace-relative, so it keeps the www/ prefix that
      # working-directory strips from the run steps above.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
