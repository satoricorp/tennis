name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      # Tracked files only. A plain `gofmt -l .` walks the filesystem rather
      # than the module, so it would also parse the Go init templates aws-cdk
      # ships under infra/node_modules once anyone runs npm install there.
      - run: gofmt -l $(git ls-files '*.go') && test -z "$(gofmt -l $(git ls-files '*.go'))"
      # Tests that need the 123MB model skip themselves when it is absent,
      # and that was the whole root package and every end-to-end CLI test.
      # The model is fetched once per checksum change, verified against the
      # SHA-256 pinned in embed/models.go, and cached.
      - uses: actions/cache@v4
        with:
          path: testdata/cache
          key: test-model-${{ runner.os }}-${{ hashFiles('embed/models.go') }}
      - run: scripts/fetch-test-model.sh
      # pdftotext is the only PDF reader tennis has on Linux, so the Linux
      # run installs it to test that path rather than skip it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: go test ./...
      - run: CGO_ENABLED=0 go build ./cmd/tennis

  # The README's "tests" badge: how much of the suite passed on main, run
  # with the model so nothing skips. shields.io reads the result from the
  # badges branch, which holds that one file and nothing else.
  #
  # It runs on macOS with pdftotext installed because that is the one
  # machine where every test applies: the macOS converters exist nowhere
  # else, and on Linux their tests can only skip, which the badge would
  # rightly report.
  tests-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    # Two pushes close together would race to force-push the branch; the
    # newer run is the one whose result should stand.
    concurrency:
      group: tests-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/cache@v4
        with:
          path: testdata/cache
          key: test-model-${{ runner.os }}-${{ hashFiles('embed/models.go') }}
      - run: scripts/fetch-test-model.sh
      - run: brew install poppler
      # A failing suite still gets a badge, a red one, so the test run's own
      # exit status does not stop the job.
      - run: go test -json ./... > results.json || true
      - run: scripts/render-test-badge.sh results.json > tests.json && cat tests.json
      - name: Publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir badge && cp tests.json badge/ && cd badge
          git init -q -b badges
          git add tests.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "tests badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/tennis
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/tennis
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/tennis
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/tennis

  # install.sh is the front door and nothing in the Go suite touches it, so it
  # gets linted and then actually run against a release built here.
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - run: shellcheck -s sh scripts/install.sh
      - run: shellcheck -s bash scripts/render-manifest.sh
      - run: shellcheck -s sh scripts/fetch-test-model.sh scripts/render-test-badge.sh

      # Stand up the exact key layout the release workflow publishes, serve it
      # over HTTP, and install from it the way a user would.
      - name: Install from a synthetic release
        run: |
          set -euo pipefail
          version=9.9.9
          arch="$(uname -m)"
          case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          host="$RUNNER_TEMP/host"
          mkdir -p "$host/v$version"

          CGO_ENABLED=0 go build -ldflags "-X main.version=$version" \
            -o "$host/tennis" ./cmd/tennis
          tar -czf "$host/v$version/tennis_${version}_linux_${arch}.tar.gz" \
            -C "$host" tennis
          rm "$host/tennis"
          (cd "$host/v$version" && sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt)
          printf '%s\n' "$version" > "$host/VERSION"

          TENNIS_DOWNLOAD_HOST=127.0.0.1:8080 VERSION="$version" \
            scripts/render-manifest.sh "$host/v$version"
          sed 's|TENNIS_DOWNLOAD_HOST|127.0.0.1:8080|g' scripts/install.sh > "$host/install.sh"

          # --directory rather than a subshell cd, so $! is unambiguously the
          # server and the trap can actually kill it.
          python3 -m http.server 8080 --directory "$host" >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 10); do
            curl -fsS http://127.0.0.1:8080/VERSION >/dev/null 2>&1 && break
            sleep 1
          done

          export TENNIS_INSTALL_BASE_URL=http://127.0.0.1:8080
          export TENNIS_INSTALL_DIR="$RUNNER_TEMP/bin"
          curl -fsSL "$TENNIS_INSTALL_BASE_URL/install.sh" | sh
          test -x "$RUNNER_TEMP/bin/tennis"
          "$RUNNER_TEMP/bin/tennis" version | grep -q "$version"

          # A tampered archive must be refused, not installed.
          printf 'tampered' | gzip > "$host/v$version/tennis_${version}_linux_${arch}.tar.gz"
          if curl -fsSL "$TENNIS_INSTALL_BASE_URL/install.sh" | sh 2>/dev/null; then
            echo "installer accepted an archive that failed its checksum" >&2
            exit 1
          fi
          echo "installer verified: good release installs, tampered release refused"

  # Catches stack mistakes at PR time; a full synth needs AWS credentials for
  # the hosted-zone lookup, so this typechecks only.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - run: npm run typecheck
        working-directory: infra
